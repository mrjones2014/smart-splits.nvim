name: 🐛 Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
assignees:
  - mrjones2014
body:
  - type: markdown
    attributes:
      value: |
        If the bug involves a multiplexer, please check whether it belongs in the backend's
        repository first. Backends are maintained separately from core.
  - type: checkboxes
    id: similar-issues
    attributes:
      label: Similar Issues
      options:
        - label: Before filing, I have searched for similar issues.
          required: true
    validations:
      required: true
  - type: textarea
    id: nvim-version
    attributes:
      label: Neovim Version
      description: "`nvim --version` output, please use a code block"
    validations:
      required: true
  - type: textarea
    id: checkhealth
    attributes:
      label: Checkhealth Output
      description: "Output of `:checkhealth smart-splits`, please use a code block"
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend
      description: "Which multiplexer backend plugin are you using, and at what version? Leave blank if none."
      placeholder: "smart-splits-backend-zellij @ v1.2.0"
  - type: textarea
    id: mux-version
    attributes:
      label: Multiplexer Version
      description: "Version of the multiplexer itself, if you use one, e.g. `zellij --version`. Please use a code block."
  - type: textarea
    id: reproduction-steps
    validations:
      required: true
    attributes:
      label: Steps to Reproduce
      value: |
        1. Create vertical split
        2. Adjust size of split
        3. ...
        4. Profit?
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: min-config
    attributes:
      label: Minimal Configuration to Reproduce
      description: "MINIMAL `init.lua` to reproduce, please use a code fence with `lua` syntax specified (e.g. ```lua). All unrelated config and plugins should be removed. See [minimal init.lua template](https://github.com/mrjones2014/smart-splits.nvim/discussions/72)"
      value: |
        ```lua
        local root = vim.fn.fnamemodify('./.repro', ':p')

        -- set stdpaths to use .repro
        for _, name in ipairs({ 'config', 'data', 'state', 'cache' }) do
          vim.env[('XDG_%s_HOME'):format(name:upper())] = root .. '/' .. name
        end

        -- bootstrap lazy
        local lazypath = root .. '/plugins/lazy.nvim'
        if not vim.uv.fs_stat(lazypath) then
          vim.fn.system({
            'git',
            'clone',
            '--filter=blob:none',
            '--single-branch',
            'https://github.com/folke/lazy.nvim.git',
            lazypath,
          })
        end
        vim.opt.runtimepath:prepend(lazypath)

        -- install plugins
        local plugins = {
          -- do not remove the colorscheme! it makes testing nicer
          'folke/tokyonight.nvim',
          {
            'mrjones2014/smart-splits.nvim',
            -- add your multiplexer backend plugin here, if you use one
            -- dependencies = { 'smart-splits-nvim/smart-splits-backend-zellij' },
          },
          -- add any other plugins here
        }

        require('lazy').setup(plugins, {
          root = root .. '/plugins',
        })

        require('smart-splits').setup({
          -- add any options here, for example
          -- mux = { backend = 'smart-splits-backend-zellij' },
        })

        -- recommended mappings
        -- resizing splits
        -- these keymaps will also accept a range,
        -- for example `10<A-h>` will `resize_left` by `(10 * config.resize.amount)`
        vim.keymap.set('n', '<A-h>', require('smart-splits').resize_left)
        vim.keymap.set('n', '<A-j>', require('smart-splits').resize_down)
        vim.keymap.set('n', '<A-k>', require('smart-splits').resize_up)
        vim.keymap.set('n', '<A-l>', require('smart-splits').resize_right)
        -- moving between splits
        vim.keymap.set('n', '<C-h>', require('smart-splits').move_cursor_left)
        vim.keymap.set('n', '<C-j>', require('smart-splits').move_cursor_down)
        vim.keymap.set('n', '<C-k>', require('smart-splits').move_cursor_up)
        vim.keymap.set('n', '<C-l>', require('smart-splits').move_cursor_right)
        -- swapping buffers between windows
        vim.keymap.set('n', '<leader><leader>h', require('smart-splits').swap_buf_left)
        vim.keymap.set('n', '<leader><leader>j', require('smart-splits').swap_buf_down)
        vim.keymap.set('n', '<leader><leader>k', require('smart-splits').swap_buf_up)
        vim.keymap.set('n', '<leader><leader>l', require('smart-splits').swap_buf_right)

        -- add anything else here
        vim.opt.termguicolors = true
        -- do not remove the colorscheme! it makes testing nicer
        vim.cmd([[colorscheme tokyonight]])
        ```
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional Details and/or Screenshots
